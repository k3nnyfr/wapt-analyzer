[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wapt-analyzer"
version = "0.10.0"
description = "Compare a WAPT server repository with the Tranquil IT store and host inventories, and suggest missing packages."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alex" }]
keywords = ["wapt", "tranquil-it", "deployment", "inventory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.28",
    "jinja2>=3.1",
    "rapidfuzz>=3.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "prompt-toolkit>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wapt-analyzer = "wapt_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wapt_analyzer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
